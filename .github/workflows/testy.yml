# Tests and quality gates. Runs on pull requests and on push to main.
# Locally the same: tools/prototyp/testy.sh (PC tests) and tools/jakosc/sprawdz.sh (core quality gates; parts: --czesc k/n).
# Sanitizers and coverage run in parallel parts split by measured time (tools/jakosc/podzial.py,
# tools/jakosc/czasy-testow.txt); the collecting jobs check that every TESTY program ran exactly once.
name: testy

on:
  push:
    branches: [main]
  pull_request:

# The token only reads the repository; no job writes anything.
permissions:
  contents: read

concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # the consistency script checks the spec commit from the header (check h)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Zależności
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++
          python3 -m pip install --quiet -r requirements-dev.txt
      - name: Pliki generowane zgodne ze źródłami (zestaw reguł i obrazy budzika)
        run: |
          python3 tools/zestaw/buduj_zestaw.py
          python3 tools/prototyp/generuj.py --tylko-obrazy
          git diff --exit-code
      - name: Testy prototypu (g++, -Werror i dodatkowe ostrzeżenia) i podgląd ekranów
        run: bash tools/prototyp/testy.sh
      - name: Spójność specyfikacji funkcjonalnej
        run: python3 tools/spojnosc.py --strict
      - name: Spójność specyfikacji technicznej (odwołania do kodu)
        run: python3 tools/spojnosc_tech.py

  # Tool tests separately from testy.sh, in parallel (pytest-xdist).
  narzedzia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # test_spojnosc_tech checks the spec commit from the header
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Zależności
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++
          python3 -m pip install --quiet -r requirements-dev.txt
      - name: Testy narzędzi (pytest -n auto)
        run: python3 -m pytest -q -n auto --dist worksteal --durations=15 tools

  # ASan + UBSan in parts by measured time (about 14 min of programs per part plus about 3 min to build the core).
  # testy_ladowarka_brzegowe_2 under sanitizers checks a sample of values (CPAP_TESTY_SANITIZERY); the program's
  # default mode (every third byte, no sanitizer) runs in testy.sh.
  sanitizery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        czesc: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Zależności (g++)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++
      - name: ASan + UBSan na testach rdzenia, część ${{ matrix.czesc }}/4 (zero zgłoszeń)
        run: bash tools/jakosc/sprawdz.sh sanitizery --czesc ${{ matrix.czesc }}/4
      - name: Lista wykonanych programów i czasy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sanitizery-${{ matrix.czesc }}
          path: |
            firmware/prototyp/.pio/jakosc/asan/programy.txt
            firmware/prototyp/.pio/jakosc/asan/czasy.txt
          retention-days: 14

  # always(): a failed or cancelled part gives an error here, not "skipped"; the standard check always runs
  jakosc:
    needs: sanitizery
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Standard (bez wyjątków i RTTI w src/)
        run: bash tools/jakosc/sprawdz.sh standard
      - name: Wszystkie części sanitizerów zaliczone
        env:
          WYNIK: ${{ needs.sanitizery.result }}
        run: '[ "$WYNIK" = success ] || { echo "BŁĄD: części sanitizerów: $WYNIK"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sanitizery-*
          path: czesci
      - name: Każdy program TESTY pod sanitizerami dokładnie raz w sumie części
        run: |
          FW="$PWD/firmware/prototyp" REPO="$PWD" bash -c 'source tools/prototyp/zrodla.sh; printf "%s\n" "${TESTY[@]}"' > testy.txt
          python3 tools/jakosc/podzial.py sprawdz --lista testy.txt czesci/sanitizery-*/programy.txt
          python3 tools/jakosc/podzial.py z-logu --krok sanitizery czesci/sanitizery-*/czasy.txt

  jakosc-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # bazy bramek porównywane z origin/main (merge-base)
      - name: Zależności (g++, gcov, clang-tidy 18)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang-tidy-18
          sudo ln -sf "$(command -v clang-tidy-18)" /usr/local/bin/clang-tidy
          clang-tidy --version | head -2
      - name: clang-tidy (zero nowych ostrzeżeń wobec tools/jakosc/clang-tidy-baza.txt)
        run: bash tools/jakosc/sprawdz.sh tidy

  # Coverage in parts: each part saves a gcov report (JSON); the merge counts coverage over all of them
  # (a line run in any part counts as run, as between .cpp units), with the same thresholds and report.
  pokrycie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        czesc: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Zależności (g++, gcov)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++
      - name: Pokrycie linii rdzenia, część ${{ matrix.czesc }}/3
        run: bash tools/jakosc/sprawdz.sh pokrycie --czesc ${{ matrix.czesc }}/3
      - name: Raport gcov części i lista programów
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pokrycie-${{ matrix.czesc }}
          path: |
            firmware/prototyp/.pio/jakosc/pokrycie/gcov.json
            firmware/prototyp/.pio/jakosc/pokrycie/programy.txt
            firmware/prototyp/.pio/jakosc/pokrycie/czasy.txt
          retention-days: 14

  jakosc-pokrycie:
    needs: pokrycie
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wszystkie części pokrycia zaliczone
        env:
          WYNIK: ${{ needs.pokrycie.result }}
        run: '[ "$WYNIK" = success ] || { echo "BŁĄD: części pokrycia: $WYNIK"; exit 1; }'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # bazy bramek porównywane z origin/main (merge-base)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pokrycie-*
          path: czesci
      - name: Każdy program TESTY w pokryciu dokładnie raz w sumie części
        run: |
          FW="$PWD/firmware/prototyp" REPO="$PWD" bash -c 'source tools/prototyp/zrodla.sh; printf "%s\n" "${TESTY[@]}"' > testy.txt
          python3 tools/jakosc/podzial.py sprawdz --lista testy.txt czesci/pokrycie-*/programy.txt
          python3 tools/jakosc/podzial.py z-logu --krok pokrycie czesci/pokrycie-*/czasy.txt
      - name: Pokrycie linii rdzenia (nie poniżej tools/jakosc/pokrycie-baza.txt)
        run: python3 tools/jakosc/pokrycie.py czesci/pokrycie-*/gcov.json
      - name: Bazy bramek nie gorsze niż na main
        run: bash tools/jakosc/sprawdz.sh bazy

  # ESP32 build: pioarduino from platformio.ini, secrets from the example file (no real passwords),
  # size budget as a gate: flash ≤ 80% of the slot, RAM ≤ 60% (tools/jakosc/budzet_pio.py).
  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware/prototyp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Pamięć podręczna PlatformIO
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.platformio
            firmware/prototyp/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/prototyp/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: PlatformIO (wersja z requirements-dev.txt)
        run: python3 -m pip install --quiet "$(grep -E '^platformio==' ../../requirements-dev.txt)"
      - name: Sekrety ze wzoru (bez prawdziwych haseł)
        run: cp include/secrets.example.h include/secrets.h
      - name: Kompilacja e1001
        run: |
          set -o pipefail
          pio run -e e1001 2>&1 | tee pio.log
      - name: Budżet rozmiaru (Flash ≤ 80%, RAM ≤ 60%)
        run: python3 ../../tools/jakosc/budzet_pio.py pio.log
      # the fallback switch must always build; about 3 min more (job about 5.5 min, limit 30 min)
      - name: Kompilacja e1001 z wyłącznikiem wysyłki blokiem (EPD_WYSYLKA_BLOKIEM=0)
        run: PLATFORMIO_BUILD_FLAGS='-DEPD_WYSYLKA_BLOKIEM=0' pio run -e e1001
      - name: Blokada wgrywania przez Wi-Fi do przejścia na układ 32 MB
        run: |
          if pio run -e e1001_ota -t upload > ota.log 2>&1; then echo "BŁĄD: blokada e1001_ota nie działa"; exit 1; fi
          grep -q "zablokowane do przejścia egzemplarza" ota.log && echo "blokada e1001_ota: ok"
      - name: Wyjątki i RTTI w rdzeniu arduino-esp32 (informacja)
        run: |
          L="$(find ~/.platformio/packages -maxdepth 1 -name 'framework-arduinoespressif32-libs*' | head -1)/esp32s3"
          echo "sdkconfig: $L"
          grep -E '^(# )?CONFIG_COMPILER_CXX_(EXCEPTIONS|RTTI)' "$L/sdkconfig" || echo "brak wpisów w sdkconfig"
          echo "flagi C++ rdzenia (wyjątki, RTTI):"
          tr ' ' '\n' < "$L/flags/cpp_flags" | grep -E 'exceptions|rtti' || echo "brak flag wyjątków i RTTI w cpp_flags"
          grep -rhoE -- '-f(no-)?(exceptions|rtti)' ~/.platformio/platforms/*/builder 2>/dev/null | sort | uniq -c || true
