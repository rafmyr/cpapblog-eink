<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rozruch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Public Sans', Arial, sans-serif; display: flex; flex-direction: column">
<div style="height: 52px; padding: 0 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000000; font-size: 20px">
<span style="font-weight: 600">sob 24.10 · 6 h 38 · 1,1 / h</span>
<span>dane 05:41</span>
</div>
<div style="flex: 1; padding: 26px 28px 24px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-size: 18px; letter-spacing: 2px; text-transform: uppercase">Pierwsze dni</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 48px; line-height: 1.1">Uczę się twojej normy.</div>
<div style="font-size: 22px; line-height: 1.4">Do tego czasu pokazuję tylko twarde sygnały: brak terapii, duży wyciek, bezdechy centralne.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 6px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="14">
<div style="{{c.style}}"></div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 18px"><span>noc 9 z 14</span><span>pełna norma od ok. 29.10</span></div>
</div>
</div>
<div style="height: 46px; padding: 0 28px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #000000; font-size: 18px">
<span>Katowice 12° · deszcz po 15:00</span>
<span>sypialnia 21° · 45% · CO2 820</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const cells = [];
for (let i = 0; i < 14; i++) {
cells.push({ style: 'flex: 1; height: 28px; box-sizing: border-box; border: 2px solid #000000; background: ' + (i < 9 ? '#000000' : '#FFFFFF') });
}
return { cells };
}
}
</script>
</body>
</html>
