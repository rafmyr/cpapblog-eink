<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kokpit 1: ostatnia noc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Public Sans', Arial, sans-serif; display: flex; flex-direction: column">
<div style="height: 48px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000000; font-size: 20px">
<span style="font-weight: 600">Ostatnia noc · czw 12.11</span>
<span>1 / 2</span>
</div>
<div style="padding: 14px 24px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border-bottom: 2px solid #000000">
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; line-height: 1.05">6:05</span><span style="font-size: 18px">godz. na masce</span></div>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; line-height: 1.05">1,8</span><span style="font-size: 18px">bezdechy / h</span></div>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; line-height: 1.05">9,7</span><span style="font-size: 18px">ciśnienie</span></div>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; line-height: 1.05">18</span><span style="font-size: 18px">wyciek L/min</span></div>
</div>
<div style="padding: 8px 24px 0; font-size: 18px">Ostatnie 30 nocy</div>
<div style="flex: 1; padding: 6px 12px 12px; display: flex; flex-direction: column; justify-content: space-between">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="{{r.box}}">
<span style="width: 120px; font-size: 22px">{{r.name}}</span>
<svg width="300" height="40" viewBox="0 0 300 40" aria-hidden="true"><polyline fill="none" stroke="{{r.ink}}" stroke-width="3" points="{{r.points}}"></polyline></svg>
<span style="width: 84px; text-align: right; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px">{{r.value}}</span>
<span style="flex: 1; padding-left: 16px; font-size: 18px">{{r.word}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const line = (vals) => vals.map((v, i) => (i * 300 / 29).toFixed(1) + ',' + (38 - v).toFixed(1)).join(' ');
const flat = (base, amp) => Array.from({ length: 30 }, (_, i) => base + amp * Math.sin(i * 1.7));
const rise = Array.from({ length: 30 }, (_, i) => i < 21 ? 8 + 3 * Math.sin(i * 1.3) : 8 + (i - 20) * 3.2);
const mk = (name, vals, value, word, inv) => ({
name, value, word, points: line(vals), ink: inv ? '#FFFFFF' : '#000000',
box: 'height: 58px; padding: 0 12px; display: flex; align-items: center; ' + (inv ? 'background: #000000; color: #FFFFFF;' : 'border-bottom: 1px solid #000000;')
});
return { rows: [
mk('Bezdechy', flat(12, 5), '1,2', 'stabilnie', false),
mk('Sen', flat(20, 4), '6:41', 'stabilnie', false),
mk('Ciśnienie', flat(18, 2), '9,5', 'stabilnie', false),
mk('Wyciek', rise, '6 L', 'wyżej niż zwykle, od 9 nocy', true)
] };
}
}
</script>
</body>
</html>
