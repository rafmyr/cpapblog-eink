<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>U-05 Test sprzętu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; background: #FFFFFF; color: #000000; font-family: 'Public Sans', Arial, sans-serif; display: flex; flex-direction: column">
<div style="height: 48px; padding: 0 26px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000000; font-size: 20px">
<span style="font-weight: 600">Test sprzętu</span>
<span>Ustawienia → Test sprzętu</span>
</div>
<div style="flex: 1; padding: 14px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px">
<div style="display: flex; flex-direction: column">
<div style="font-size: 16px; letter-spacing: 1px; text-transform: uppercase; padding-bottom: 6px; border-bottom: 2px solid #000000">Oprogramowanie i pamięć</div>
<sc-for list="{{lewa}}" as="r" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; height: 46px; align-items: center; border-bottom: 1px solid #000000; font-size: 20px"><span>{{r.k}}</span><span style="font-weight: 600; text-align: right">{{r.v}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column">
<div style="font-size: 16px; letter-spacing: 1px; text-transform: uppercase; padding-bottom: 6px; border-bottom: 2px solid #000000">Łączność i bateria</div>
<sc-for list="{{prawa}}" as="r" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 12px; height: 46px; align-items: center; border-bottom: 1px solid #000000; font-size: 20px"><span>{{r.k}}</span><span style="font-weight: 600; text-align: right">{{r.v}}</span></div>
</sc-for>
</div>
<div style="grid-column: 1 / 3; margin-top: auto; display: flex; justify-content: space-between; align-items: center; border: 2px solid #000000; padding: 8px 14px; font-size: 20px">
<span style="font-weight: 600">Wgrywanie przez Wi-Fi do {{okno}}</span>
<span>hasła i dane terapii nie są pokazywane</span>
</div>
</div>
<div style="height: 42px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #000000; font-size: 18px; font-weight: 600">
<span>↻ odśwież · 2 s pakiet z karty</span>
<span>◀ wróć</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const lewa = [
{ k: 'Oprogramowanie', v: '1.0.1 (app1)' },
{ k: 'Zestaw reguł', v: '2026-12-01' },
{ k: 'Pamięć panelu', v: 'wolne 18 MB' },
{ k: 'Karta', v: 'kopia 03.11 05:40' },
{ k: 'Źródło otoczenia', v: 'OK 05:31' }
];
const prawa = [
{ k: 'Panel', v: '192.168.30.51' },
{ k: 'Wi-Fi', v: 'Dom −61 dBm' },
{ k: 'AirBridge', v: '192.168.20.205 · v2.3.0' },
{ k: 'Ostatnie pobranie', v: '03.11 05:32' },
{ k: 'Bateria', v: '64%' }
];
return { lewa, prawa, okno: '10:14' };
}
}
</script>
</body>
</html>
