<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>S-K-01 Przewietrz sypialnię</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<dc-import name="Ekran" cfg="{{cfg}}" hint-size="800px,480px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>

return { cfg: {

step: 'Uchyl okno na noc. Same otwarte drzwi dają mniej.',
fl: 'Katowice 7° · PM2.5 za oknem 9', fr: 'sypialnia 21° · 44%'
} };
}
}
</script>

</html>
