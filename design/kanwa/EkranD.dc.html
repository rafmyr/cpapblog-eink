<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Szablon docelowy z budzikiem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{rootStyle}}">
<div style="{{frameStyle}}">
<div style="{{headStyle}}">
<span style="font-weight: 600">{{c.hl}}</span>
<span>{{c.hr}}</span>
</div>
<div style="flex: 1; display: flex; min-height: 0">
<div style="flex: 1; min-width: 0; padding: 18px 26px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px">
<div style="font-size: 18px; letter-spacing: 2px; text-transform: uppercase">{{c.label}}</div>
<div style="display: flex; align-items: center; gap: 16px">
<sc-if value="{{isLekarz}}" hint-placeholder-val="{{ false }}">
<svg width="48" height="44" viewBox="0 0 56 50" role="img" aria-label="Ostrzeżenie"><path d="M28 4 L53 46 L3 46 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"></path><line x1="28" y1="18" x2="28" y2="32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></line><circle cx="28" cy="39" r="2.5" fill="#FFFFFF"></circle></svg>
</sc-if>
<div style="{{titleStyle}}">{{c.title}}</div>
</div>
<div style="font-size: 24px; line-height: 1.3">{{c.reason}}</div>
<div style="height: 112px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px">
<sc-if value="{{isLine}}" hint-placeholder-val="{{ false }}">
<svg width="{{vw}}" height="84" viewBox="{{vb}}" aria-hidden="true">
<sc-if value="{{line.hasT}}" hint-placeholder-val="{{ false }}"><line x1="0" x2="{{vw}}" y1="{{line.ty}}" y2="{{line.ty}}" stroke="{{fg}}" stroke-width="2" stroke-dasharray="6 6"></line></sc-if>
<polyline fill="none" stroke="{{fg}}" stroke-width="3" points="{{line.pts}}"></polyline>
</svg>
</sc-if>
<sc-if value="{{isBars}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; gap: 28px; height: 108px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
<div style="display: flex; align-items: flex-end; gap: 10px">
<div style="{{b.st}}"></div>
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; line-height: 1">{{b.v}}</span><span style="font-size: 18px">{{b.l}}</span></div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isDots}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="14"><div style="{{d.st}}"></div></sc-for>
</div>
</sc-if>
<sc-if value="{{isPairs}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 44px">
<sc-for list="{{pairs}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; line-height: 1">{{p.v}}</span><span style="font-size: 18px">{{p.l}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isSeg}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; height: 40px; border-bottom: 2px solid {{fg}}">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="5"><div style="{{s.st}}"></div></sc-for>
</div>
</sc-if>
<sc-if value="{{isChecks}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 20px">
<sc-for list="{{checks}}" as="k" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; font-size: 20px"><div style="{{k.st}}"></div><span>{{k.l}}</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isStack}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; justify-content: space-between; height: 84px">
<sc-for list="{{stack}}" as="s" hint-placeholder-count="14">
<div style="display: flex; flex-direction: column; width: 36px"><div style="{{s.c}}"></div><div style="{{s.o}}"></div></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isBig}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: baseline; gap: 16px"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 96px; line-height: 0.9">{{big.v}}</span><span style="font-size: 22px">{{big.l}}</span></div>
</sc-if>
<div style="display: flex; justify-content: space-between; font-size: 18px"><span>{{capL}}</span><span>{{capR}}</span></div>
</div>
<div style="font-size: 24px; font-weight: 600">→ {{c.step}}</div>
</div>
<sc-if value="{{hasImg}}" hint-placeholder-val="{{ false }}">
<div style="{{sideStyle}}">
<sc-if value="{{hasSay}}" hint-placeholder-val="{{ false }}"><div style="{{bubbleStyle}}">{{c.say}}</div></sc-if>
<img src="{{c.img}}" alt="{{c.alt}}" style="{{imgStyle}}">
</div>
</sc-if>
</div>
<div style="{{footStyle}}">
<span>{{footL}}</span>
<span>{{c.fr}}</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cfg":{"editor":null},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const c = this.props.cfg || {
ton: 'spokoj', hl: 'śr 21.10 · wieczór', hr: 'sypialnia 21:30', label: 'Szablon', title: 'Tytuł do 30 znaków',
reason: 'Powód do 70 znaków, z liczbą wstawioną z danych.', step: 'Krok do 60 znaków.', fl: 'stopka lewa', fr: 'stopka prawa',
viz: 'line', line: { v: [3, 4, 3, 5, 6, 7, 6, 8, 9, 8], t: 6, cl: 'opis osi', cr: 'linia przerywana = próg' }
};
const inv = c.ton === 'problem' || c.ton === 'lekarz';
const hasImg = !!c.img; const vw = hasImg ? 470 : 748;
const lek = c.ton === 'lekarz';
const fg = inv ? '#FFFFFF' : '#000000';
const bg = inv ? '#000000' : '#FFFFFF';
const rootStyle = 'width: 800px; height: 480px; box-sizing: border-box; background: ' + bg + '; color: ' + fg + '; font-family: \'Public Sans\', Arial, sans-serif; padding: ' + (lek ? '10px' : '0');
const frameStyle = 'width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; ' + (lek ? 'border: 6px solid #FFFFFF;' : '');
const headStyle = 'height: 48px; padding: 0 26px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid ' + fg + '; font-size: 20px';
const footStyle = 'height: 42px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 2px solid ' + fg + '; font-size: 18px' + (c.hint ? '; font-weight: 600' : '');
let line = { pts: '', hasT: false, ty: 0 }, capL = '', capR = '';
if (c.viz === 'line' && c.line) {
const v = c.line.v, all = v.concat(c.line.t != null ? [c.line.t] : []);
const mn = Math.min.apply(null, all), mx = Math.max.apply(null, all), rg = (mx - mn) || 1;
const y = (x) => (78 - (x - mn) / rg * 72).toFixed(1);
line.pts = v.map((x, i) => (i * vw / (v.length - 1)).toFixed(1) + ',' + y(x)).join(' ');
if (c.line.t != null) { line.hasT = true; line.ty = y(c.line.t); }
capL = c.line.cl || ''; capR = c.line.cr || '';
}
const bars = (c.bars || []).map((b) => ({ v: b.v, l: b.l, st: 'width: 64px; height: ' + Math.round(14 + b.h * 92) + 'px; box-sizing: border-box; border: 3px solid ' + fg + '; background: ' + (b.full ? fg : 'transparent') }));
let dots = [];
if (c.dots) { dots = c.dots.d.map((x) => ({ st: 'width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: 2px solid ' + fg + '; background: ' + (x ? fg : 'transparent') })); capL = c.dots.cl || ''; capR = c.dots.cr || ''; }
let segs = [];
if (c.seg) { segs = c.seg.s.map((s) => ({ st: 'position: absolute; top: 8px; height: 24px; left: ' + (s[0] * vw).toFixed(0) + 'px; width: ' + ((s[1] - s[0]) * vw).toFixed(0) + 'px; background: ' + fg })); capL = c.seg.cl || ''; capR = c.seg.cr || ''; }
const checks = (c.checks || []).map((k) => ({ l: k.l, st: 'width: 20px; height: 20px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2px solid ' + fg + '; background: ' + (k.ok ? fg : 'transparent') }));
let stack = [];
if (c.stack) {
const mx = Math.max.apply(null, c.stack.d.map((p) => p[0] + p[1])) || 1;
stack = c.stack.d.map((p) => ({ o: 'height: ' + Math.round(p[0] / mx * 80) + 'px; background: ' + fg, c: 'height: ' + Math.round(p[1] / mx * 80) + 'px; box-sizing: border-box; border: 2px solid ' + fg + '; border-bottom: none' }));
capL = c.stack.cl || ''; capR = c.stack.cr || '';
}
if (c.caps) { capL = c.caps[0]; capR = c.caps[1]; }
return {
c, fg, hasImg, hasSay: !!c.say, vw, vb: '0 0 ' + vw + ' 84',
titleStyle: "font-family: 'Source Serif 4', Georgia, serif; line-height: 1.02; font-size: " + (hasImg ? '42px' : '48px'),
sideStyle: 'width: 270px; flex: none; padding: 14px 18px 8px 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px',
bubbleStyle: 'border: 2px solid ' + fg + '; border-radius: 18px; padding: 8px 12px; font-size: 19px; line-height: 1.2; text-align: center; font-style: italic',
imgStyle: 'display: block; width: ' + (c.iw || 220) + 'px; height: ' + (c.ih || 220) + 'px; image-rendering: pixelated' + (inv ? '; filter: invert(1)' : ''),
footL: c.hint ? '◆ ' + c.hint : c.fl, rootStyle, frameStyle, headStyle, footStyle, isLekarz: lek,
isLine: c.viz === 'line', isBars: c.viz === 'bars', isDots: c.viz === 'dots', isPairs: c.viz === 'pairs',
isSeg: c.viz === 'seg', isChecks: c.viz === 'checks', isStack: c.viz === 'stack', isBig: c.viz === 'big',
line, bars, dots, pairs: c.pairs || [], segs, checks, stack, capL, capR, big: c.big || { v: '', l: '' }
};
}
}
</script>
</body>
</html>
