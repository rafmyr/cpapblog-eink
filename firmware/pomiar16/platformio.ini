; Szkic pomiaru 16 (T-TEST-253): czy pamięć flash powyżej 16 MB działa na egzemplarzu E1001.
; To NIE jest firmware panelu: osobny katalog, osobne środowisko, nie wchodzi do `e1001` ani do jego rozmiaru.
; Płytka i tablica partycji są TE SAME co w firmware docelowym (firmware/boards/reterminal_e1001.json,
; firmware/partycje-e1001.csv), bo test ma sprawdzić dokładnie ten układ, który dostanie firmware.
; Na sprzęcie jeszcze nie uruchomiony (stan 05.11.2026): tylko kompilacja.

[platformio]
default_envs = pomiar16
boards_dir = ../boards

[env:pomiar16]
; ta sama wersja rdzenia co `e1001` (pioarduino 55.03.312-1, spec techniczna 8.3)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = reterminal_e1001
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = ../partycje-e1001.csv
monitor_speed = 115200
; mostek USB panelu gubi dane przy 460800 i 921600 (jak w `e1001`)
upload_speed = 115200
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DBOARD_HAS_PSRAM
  ; Serial = UART0 przez mostek USB-UART panelu, jak w `e1001`
  -DARDUINO_USB_CDC_ON_BOOT=0
