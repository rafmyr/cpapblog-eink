; Firmware panelu cpap-eink (wydanie 1.0.0-beta.1) na reTerminal E1001 (ESP32-S3, e-ink 800x480 mono).
; Numer wydania: WERSJA w src/main.cpp; katalog `prototyp` to historyczna nazwa ścieżki.
; Piny i ustawienia płytki: wiki Seeed „reTerminal E10xx with Arduino” i „peripherals”.

[platformio]
; samo `pio run` buduje i wgrywa tylko kablem; Wi-Fi: -e e1001_ota (tools/prototyp/wgraj_wifi.sh), zablokowane do
; przejścia egzemplarza na układ 32 MB
default_envs = e1001
; własne definicje płytek (spec techniczna 8.3): firmware/boards/reterminal_e1001.json
boards_dir = ../boards

[env:e1001]
; pioarduino (Arduino core 3.x, ESP-IDF 5.x): starszy 6.5.0 nie łączy się z siecią WPA3 z H2E (router 6 GHz)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; własna definicja płytki (spec 8.3): firmware/boards/reterminal_e1001.json, flash 32 MB QIO, PSRAM OPI, wariant pinów
; XIAO_ESP32S3 jak w prototypie (seeed_xiao_esp32s3); kompilacja sprawdzona pio 6.2.0
board = reterminal_e1001
framework = arduino
board_build.arduino.memory_type = qio_opi
; historia nocy w pamięci flash panelu (ADR-0017); system plików tworzy firmware (pierwsze formatowanie T-WYM-84),
; obrazu `uploadfs` w wersji 1.0 nie ma (spec 8.8)
board_build.filesystem = littlefs
; tablica partycji 32 MB (spec 8.2, T-WYM-38): sloty po 4 MB, pliki 23,9 MB od 0x820000. Wariant
; zapasowy do 16 MB: ../partycje-e1001-16mb.csv. Zmiana pliku = nowy układ: tylko kablem, z przejściem 8.9.
board_build.partitions = ../partycje-e1001.csv
monitor_speed = 115200
; skrót commitu do identyfikatora wersji; identyfikator tablicy partycji
; do porównania z tablicą panelu (UKLAD_PARTYCJI, R7)
extra_scripts =
  pre:wersja_budowy.py
  pre:uklad_partycji.py
upload_speed = 115200  ; mostek USB panelu gubi dane przy 460800 i 921600
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DBOARD_HAS_PSRAM
  ; Serial = UART0 (GPIO43/44) przez mostek USB-UART panelu, nie natywne USB
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; pule zdań budzika: domyślnie w prototypie także z listą propozycji (5.7.5); od puli przyjętej 08.11.2026
  ; wszystkie zdania są przyjęte, a listy propozycji puste, więc flaga nie zmienia zdań (zostaje na kolejną rundę):
  ; -DHUMOR_PROPOZYCJE=0
; wersje przypięte, żeby build z czystego klonu dawał ten sam firmware (NOTICE, spec 10.3)
lib_deps =
  zinggjm/GxEPD2 @ 1.6.9
  adafruit/Adafruit GFX Library @ 1.13.0
  adafruit/Adafruit BusIO @ 1.17.4

; Obraz do pracy przy biurku: po każdym rysowaniu z przycisku cały ekran idzie base64 na port szeregowy
; (tools/prototyp/podglad.py). Tylko kablem i tylko na panelu deweloperskim: zwykły obraz (`e1001`) jest bez
; zrzutu, bo zrzut wydłuża wybudzenie o ok. 1 s i wysyła treść ekranu (dane terapii) na port szeregowy.
[env:e1001_dev]
extends = env:e1001
build_flags =
  ${env:e1001.build_flags}
  -DZRZUT_EKRANU=1

; Obraz wydania do aktualizacji z GitHub (ADR-0032, ADR-0038): bez secrets.h (sieć, AirBridge, hasło okna,
; źródło otoczenia i współrzędne zostają w pamięci panelu). Buduje go tools/wydanie/wydaj.py, który podaje numer wersji
; przez PLATFORMIO_BUILD_FLAGS (-DWERSJA_WYDANIA=\"1.0.1\") i adres repo wydań (-DREPO_WYDAN=\"wlasciciel/nazwa\").
[env:e1001_wydanie]
extends = env:e1001
build_flags =
  ${env:e1001.build_flags}
  -DBEZ_SEKRETOW

; Wgrywanie przez Wi-Fi (ArduinoOTA): panel na ekranie „Test sprzętu” (K2, przytrzymaj ◀), potem
; tools/prototyp/wgraj_wifi.sh (hasło z Pęku kluczy macOS do zmiennej CPAP_OTA_PASS). Pierwsza wersja z OTA: kablem.
; ZABLOKOWANE do przejścia egzemplarza na układ 32 MB: `-t upload` kończy się błędem
; z blokada_ota.py; budowanie działa. Zdjęcie blokady: usunąć `pre:blokada_ota.py` niżej.
[env:e1001_ota]
extends = env:e1001
extra_scripts =
  pre:wersja_budowy.py
  pre:uklad_partycji.py
  pre:blokada_ota.py
upload_protocol = espota
upload_port = cpap-eink.local
upload_flags = --auth=${sysenv.CPAP_OTA_PASS}
